        analysis: "\"Обычные подозреваемые\" (The Usual Suspects, 1995). Пять преступников воспринимают свою встречу в полицейском участке на опознании как рутинную случайность, естественное стечение обстоятельств в криминальном мире. Они считают, что оказались вместе просто потому, что \"так бывает\" - это природа их жизни как преступников. В откровении раскрывается, что Кайзер Созе организовал это \"случайное\" собрание с конкретной целью: сформировать команду для ограбления корабля и устранения единственного человека, способного его опознать. Естественный ход событий оказывается служением чужой цели."
