        analysis: "\"Шоу Трумана\" (The Truman Show, 1998). Ожидание: Трумен воспринимает свою жизнь в городе Сихейвен как естественный ход вещей, структуру обычной жизни обычного человека (Ф). Он не принимает активных решений о том, где жить - он просто живёт там, где родился, работает, где получилось. Это воспринимается как природа его существования, не как результат чьих-то действий или его собственных целенаправленных решений. Откровение: Каждый аспект его местоположения и перемещений организован режиссёром Кристофом и продюсерами через актёров, декорации и сценарии (Д). Конкретные агенты целенаправленно управляют каждым его шагом."
