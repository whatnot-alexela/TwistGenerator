        analysis: "\"Пункт назначения\" ( Final Destination , 2000). Центральный твист точно соответствует формуле. Выжившие воспринимают последующие несчастные случаи как физические причины: падающие предметы, утечки газа, случайные стечения физических обстоятельств. Их перемещения к местам гибели кажутся результатом обычной жизни и материальных причин. В откровении раскрывается философская концепция: все эти \"случайные\" физические события и перемещения служат цели Смерти - восстановить нарушенный порядок, забрать тех, кто должен был умереть. Материальная случайность оказывается служением метафизической цели."
