name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install pytest pytest-asyncio pyyaml ruff mypy

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy core scripts bot

      - name: Tests
        run: pytest -q

      - name: Methodology import is reproducible
        run: |
          python scripts/import_fb2.py methodology/source/twist_generator_v1.fb2
          git diff --exit-code -- methodology/examples methodology/core \
            || { echo "::error::Committed methodology data is stale — re-run scripts/import_fb2.py and commit."; exit 1; }
